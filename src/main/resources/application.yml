spring:
  application:
    name: corebank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corebank}
    username: ${DB_USERNAME:corebank}
    password: ${DB_PASSWORD:corebank_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

corebank:
  kafka:
    topic:
      financial-events: corebank.financial-events.v1
  outbox:
    batch-size: 100
    fixed-delay-ms: 2000
    max-attempts: 5
    retry-delays:
      - 2s
      - 5s
      - 15s
      - 30s

info:
  app:
    name: CoreBank
    version: 0.6.0
    description: Banking as a Service portfolio backend
