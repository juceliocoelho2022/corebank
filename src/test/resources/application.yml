spring:
  application:
    name: corebank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corebank}
    username: ${DB_USERNAME:corebank}
    password: ${DB_PASSWORD:corebank_dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  health:
    redis:
      enabled: false

corebank:
  cache:
    key-prefix: "corebank:v1:"
    summary-ttl: 5m
    idempotency-replay-ttl: 1h
  kafka:
    topic:
      financial-events: corebank.financial-events.v1
      financial-events-dlq: corebank.financial-events.dlq.v1
  outbox:
    batch-size: 100
    fixed-delay-ms: 600000
    max-attempts: 5
    retry-delays:
      - 2s
      - 5s
      - 15s
      - 30s
  dlq:
    batch-size: 100
    fixed-delay-ms: 600000
    retry-delays:
      - 5s
      - 15s
      - 30s
      - 60s
    max-delay: 60s
